<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translation-key="title">Derivative Math Game</title>
    <!-- Include KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="languageSwitcher">
        <button id="langFr">Français</button>
        <button id="langEn">English</button>
        <button id="langEs">Español</button>
    </div>

    <h1 id="gameTitle" data-translation-key="title">Derivative Math Game</h1>
    <p id="messages"></p>

    <div id="difficultySettings">
        <label for="difficulty" id="difficultyLabel" data-translation-key="difficultyLabel">Difficulty Level:</label>
        <select id="difficultySelect" name="difficulty">
            <option value="easy" data-translation-key="difficultyEasy">Easy</option>
            <option value="medium" data-translation-key="difficultyMedium" selected>Medium</option>
            <option value="hard" data-translation-key="difficultyHard">Hard</option>
            <option value="expert" data-translation-key="difficultyExpert">Expert</option>
        </select>
        <button id="newExpressionButton" data-translation-key="newExpressionButton">Get New Expression</button>
    </div>

    <div id="scoreDisplay" class="score-container">
        <div class="score-info">
            <h3 id="scoreTitle">
                <span data-translation-key="score">Score:</span>
                <span id="currentScore">0</span>
            </h3>
        </div>
        <div class="score-stats">
            <p id="currentDifficultyLabel">
                <span data-translation-key="currentDifficulty">Current Difficulty:</span>
                <span id="currentDifficulty">Easy</span>
            </p>
            <p id="difficultyMultiplierLabel">
                <span data-translation-key="difficultyMultiplier">Difficulty Multiplier:</span>
                <span id="difficultyMultiplier">1x</span>
            </p>
        </div>
    </div>

    <div id="currentExpression-container">
        <h2 data-translation-key="currentFunction">Current Expression:</h2>
        <p id="currentExpression" class="fade-scale-in"></p>
    </div>

    <div>
        <button id="simplifyButton" data-translation-key="simplifyButton">Simplify Expression</button>
    </div>

    <div id="derivativeRules">
        <h3 id="derivativeRulesTitle" data-translation-key="derivativeRules">Derivative Rules:</h3>
        <div class="button-container">
            <button id="linearityRuleButton" data-math-key="applyLinearityRule">\( \frac{d}{dx} [af(x) + bg(x)] = a
                \cdot f'(x) + b \cdot g'(x) \)</button>
            <button id="powerRuleButton" data-math-key="applyPowerRule">\( \frac{d}{dx} x^n = n x^{n-1} \)</button>
            <button id="chainRuleButton" data-math-key="applyChainRule">\( \frac{d}{dx} f(g(x)) = f'(g(x)) \cdot g'(x)
                \)</button>
            <button id="productRuleButton" data-math-key="applyProductRule">\( \frac{d}{dx} [f(x) \cdot g(x)] = f'(x)
                \cdot g(x) + f(x) \cdot g'(x) \)</button>
            <button id="quotientRuleButton" data-math-key="applyQuotientRule">\( \frac{d}{dx} \frac{f(x)}{g(x)} =
                \frac{f'(x) \cdot g(x) - f(x) \cdot g'(x)}{[g(x)]^2} \)</button>
            <button id="constantRuleButton" data-math-key="applyConstantRule">\( \frac{d}{dx} c = 0 \)</button>
        </div>
    </div>

    <div id="functionDerivativeButtons">
        <h3 id="functionDerivativesTitle" data-translation-key="functionDerivatives">Function Derivatives:</h3>

        <fieldset>
            <legend data-translation-key="exponentialAndLogarithmic">Exponential and Logarithmic Functions</legend>
            <button id="exponentialFunctionButton" data-math-key="exponentialFunction">\( \frac{d}{dx} e^{f(x)} =
                e^{f(x)}
                \cdot f'(x) \)</button>
            <button id="logarithmicFunctionButton" data-math-key="logarithmicFunction">\( \frac{d}{dx} \ln(f(x)) =
                \frac{1}{f(x)} \cdot f'(x) \)</button>
        </fieldset>

        <fieldset>
            <legend data-translation-key="trigonometricFunctions">Trigonometric Functions</legend>
            <div>
                <span data-translation-key="rewriteRecipTrigFunctions">Rewrite Reciprocal Trigonometric
                    Functions: </span>
                <button id="rewriteRecipTrigFunctionsButton" data-math-key="rewriteRecipTrigFunctions">
                    Placeholder
                </button>
            </div>
            <div id="trigonometricFunctionsButtons">
                <button id="sineFunctionButton" data-math-key="sineFunction">\( \frac{d}{dx} \sin(x) = \cos(x)
                    \)</button>
                <button id="cosineFunctionButton" data-math-key="cosineFunction">\( \frac{d}{dx} \cos(x) = -\sin(x)
                    \)</button>
                <button id="tangentFunctionButton" data-math-key="tangentFunction">\( \frac{d}{dx} \tan(x) =
                    \sec^2(x)
                    \)</button>
            </div>
            <div id="inverseTrigonometricFunctionsButtons">
                <button id="inverseSineFunctionButton" data-math-key="inverseSineFunction">\( \frac{d}{dx}
                    \sin^{-1}(x) =
                    \frac{1}{\sqrt{1-x^2}} \)</button>
                <button id="inverseCosineFunctionButton" data-math-key="inverseCosineFunction">\( \frac{d}{dx}
                    \cos^{-1}(x) = \frac{-1}{\sqrt{1-x^2}} \)</button>
                <button id="inverseTangentFunctionButton" data-math-key="inverseTangentFunction">\( \frac{d}{dx}
                    \tan^{-1}(x) = \frac{1}{1+x^2} \)</button>
            </div>
        </fieldset>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.1.1/math.min.js"></script>
    <script type="module" src="/js/room.js"></script>
    <script type="module" src="/js/websocket.js" defer></script>
    <script type="module" src="/js/translations.js"></script>
    <script type="module" src="/js/ui.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>

</html>
